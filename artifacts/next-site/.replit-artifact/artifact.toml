kind = "web"
previewPath = "/"
title = "Next.js Site"
description = "A Next.js 14 App Router scaffold with TypeScript, Tailwind CSS, Supabase SSR, Resend, and Cloudflare Pages compatibility. Includes placeholder routes for all public pages, admin, and API stubs."
version = "1.0.0"
id = "artifacts/next-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24118

[services.development]
run = "pnpm --filter @workspace/next-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/next-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/next-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24118"
BASE_PATH = "/"
