kind = "web"
previewPath = "/"
title = "Next.js Site"
description = "A Next.js 14 App Router scaffold with TypeScript, Tailwind CSS, Supabase SSR, Resend, and Cloudflare Pages compatibility. Includes placeholder routes for all public pages, admin, and API stubs."
version = "1.0.0"
id = "artifacts/next-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24118

[services.development]
run = "pnpm --filter @workspace/next-site run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/next-site", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/next-site", "run", "start"]

[services.production.run.env]
NODE_ENV = "production"

[services.env]
PORT = "24118"
BASE_PATH = "/"
